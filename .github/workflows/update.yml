name: daily-update
# The upstream export is rebuilt at 04:37 UTC; this runs after it.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run update
      - name: Commit changes
        run: |
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "data: update $(date -u +%F)"
          git push
